<!DOCTYPE html>
<html lang="zh-CN"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>课程控制台</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/schedule.css">
  <link rel="stylesheet" href="css/analytics.css?v=20261020-1">
  <link rel="stylesheet" href="css/responsive.css?v=20261020-1">
  <link rel="stylesheet" href="css/personal.css?v=20261020-2">
  <link rel="stylesheet" href="css/today.css?v=20261020-8">
  <link rel="stylesheet" href="css/daily.css?v=20261020-6">
</head>
<body>
  <div id="loading-screen" class="loading-screen">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在加载课程数据…</div>
  </div>

  <div id="app" style="display: none;">
    <!-- Desktop Header -->
    <header class="app-header desktop-only">
      <div class="app-header-inner">
        <div class="header-left">
          <div class="class-selector" id="class-selector-desktop">
            <button class="class-selector-btn" id="class-selector-btn-desktop">
              <span id="current-class-name-desktop">26虚拟现实技术应用1</span>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="class-selector-dropdown" id="class-selector-dropdown-desktop"></div>
          </div>
        </div>
        <nav class="main-nav" id="main-nav-desktop">
          <a class="nav-item active" data-route="today" href="#/today">今日</a>
          <a class="nav-item" data-route="schedule" href="#/schedule">课表</a>
          <a class="nav-item" data-route="tasks" href="#/tasks">待办</a>
          <a class="nav-item" data-route="wardrobe" href="#/wardrobe">衣橱</a>
          <a class="nav-item" data-route="analytics" href="#/analytics">分析</a>
          <a class="nav-item" data-route="compare" href="#/compare">对比</a>
          <a class="nav-item" data-route="data" href="#/data">数据</a>
          <a class="nav-item" data-route="settings" href="#/settings">设置</a>
        </nav>
      </div>
    </header>

    <!-- Mobile Header -->
    <header class="mobile-header mobile-only">
      <div class="mobile-header-inner">
        <span class="mobile-header-label">选择班级</span>
        <div class="mobile-class-selector" id="class-selector-mobile">
          <button class="mobile-class-btn" id="class-selector-btn-mobile">
            <span class="mobile-class-name" id="current-class-name-mobile">26虚拟现实技术应用1</span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
    </header>
    <div class="mobile-class-dropdown mobile-only" id="class-selector-dropdown-mobile">
        <div class="mobile-class-dropdown-inner">
          <div class="mobile-class-dropdown-title">选择班级</div>
          
            <button class="mobile-class-option active" data-class="26虚拟现实技术应用1">
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>26虚拟现实技术应用1</span>
            </button>
            <button class="mobile-class-option " data-class="26虚拟现实技术应用2">
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>26虚拟现实技术应用2</span>
            </button>
            <button class="mobile-class-option " data-class="26虚拟现实技术应用3">
              <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>26虚拟现实技术应用3</span>
            </button>
        </div></div>

    <main class="page-container">
      <div class="page-view active" id="view-today"></div>
      <div class="page-view" id="view-schedule"></div>
      <div class="page-view" id="view-tasks"></div>
      <div class="page-view" id="view-wardrobe"></div>
      <div class="page-view" id="view-analytics"></div>
      <div class="page-view" id="view-compare"></div>
      <div class="page-view" id="view-data"></div>
      <div class="page-view" id="view-settings"></div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav mobile-only" id="bottom-nav">
      <a class="bottom-nav-item active" data-route="today" href="#/today">
        <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <polyline points="12 7 12 12 15.5 14"></polyline>
        </svg>
        <span class="bottom-nav-label">今日</span>
      </a>
      <a class="bottom-nav-item" data-route="schedule" href="#/schedule">
        <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="bottom-nav-label">课表</span>
      </a>
      <a class="bottom-nav-item" data-route="tasks" href="#/tasks">
        <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6h11M9 12h11M9 18h11M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"></path>
        </svg>
        <span class="bottom-nav-label">待办</span>
      </a>
      <a class="bottom-nav-item" data-route="settings" href="#/settings">
        <svg class="bottom-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span class="bottom-nav-label">更多</span>
      </a>
    </nav>
  </div>

  <!-- Course details are rendered only when opened. -->
  <div class="detail-overlay" id="detail-overlay" aria-hidden="true" inert>
    <div class="detail-panel" id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="course-detail-title"></div>
  </div>

  <script>
    if (location.protocol === 'file:') {
      document.querySelector('#loading-screen .loading-spinner').style.display = 'none';
      document.querySelector('#loading-screen .loading-text').textContent =
        '请双击项目文件夹中的“本地预览.cmd”打开课程表。';
    }
  </script>
  <script type="module" src="js/main.js?v=20261020-8"></script>


</body></html>
